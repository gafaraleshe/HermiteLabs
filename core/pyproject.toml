[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermite-core"
version = "0.1.0"
description = "Hermite shared core: transcription pipeline, model registry, subtitle formats"
requires-python = ">=3.10"
# Deliberately dependency-free at the base: subtitles/models import nothing
# heavy, and transcribe.py lazy-imports its engine. Install the extra where
# you actually run inference (the local backend, or the cloud API workers).
dependencies = []

[project.optional-dependencies]
local = [
  "faster-whisper>=1.0",
  "huggingface_hub>=0.23",
]

[tool.setuptools.packages.find]
include = ["hermite_core*"]
