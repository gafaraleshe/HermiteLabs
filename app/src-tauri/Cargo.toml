[package]
name = "hermite"
version = "0.1.0"
description = "Hermite — smooth animation for DaVinci Resolve"
authors = ["Gaffy Studios"]
edition = "2021"

[lib]
name = "hermite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
